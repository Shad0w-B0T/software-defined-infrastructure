#cloud-config
users:
  - name: ${loginUser}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
    groups: [sudo, systemd-journal]

# Host SSH key injection for known_hosts consistency
ssh_keys:
  ed25519_private: |
    ${host_private_key}
  ed25519: ${host_public_key}

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
package_reboot_if_required: true

packages:
  - fail2ban
  - plocate
  - python3
  - python3-systemd

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      allowipv6 = auto
      bantime = 10m
      findtime = 10m
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 3

runcmd:
  - updatedb
  - systemctl enable fail2ban
  - systemctl restart fail2ban
  - |
    sed -i 's/^#*PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
    sed -i 's/^#*PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
    systemctl restart sshd
