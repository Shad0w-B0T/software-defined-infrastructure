image: node:20

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

build_docs:
  stage: build
  script:
    - npm run docs:build
  artifacts:
    paths:
      - docs/.vitepress/dist
    expire_in: 1 hour

pages:
  stage: deploy
  script:
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  only:
    - main
